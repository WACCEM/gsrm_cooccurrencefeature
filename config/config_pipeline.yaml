---
# Registry of the sources and steps run by scripts/run_cof_pipeline.py (Analyses 1 and 2).
#
# Steps, in the order of the dependency graph (see docs/procedures/run_cof_pipeline.md):
#   s1          make_mcs_swath_masks.py               mcs_masks/{name}_mcs_masks_hp8.zarr            (needs the hourly MCS mask store)
#   s2          combine_tracking_masks.py             all_masks/{name}_allmasks_hp8_v1.zarr          (IMERG: combine_era5_imerg_tracking_masks.py)
#   s3          make_cooccurrence_masks.py            cof_masks/{name}_cofmasks_hp8_v1.zarr
#   monthly     calc_monthly_rainmap_by_cof.py        cof_masks/stats/monthly/{name}_monthly_rainmap_cof_hp8_v1.nc      (Analysis 1)
#   thresholds  calc_extreme_precip_thresholds.py     extreme_precip/{name}_precip_percentiles_6h_hp8_v1.nc             (Analysis 2)
#   attribution calc_stormtype_extreme_precip_spatial.py  extreme_precip/{name}_stormtype_spatial_p90.nc, ..._p95.nc   (Analysis 2)
# s1 -> s2 -> s3 -> monthly;  s3 + thresholds -> attribution;  thresholds needs s1 when it reads Step 1's tot_pr and nothing when
# it reads an input store of its own (IMERG). A source whose 'thresholds' has a 'version' (IMERG: v1_2014_2024) gets that version in the
# name of its thresholds file, {name}_precip_percentiles_6h_hp8_{version}.nc, and its attribution reads that file (--threshold_file).
#
# 'slots' are CPU slots (workers x threads) that a step takes from the runner's budget while it runs; 'est_min' is the wall time
# measured in the full run of 2026-09-20 (all six sources at once on one 503 GB node, 204 slots, 94.6 min in total; IMERG's thresholds:
# 2026-09-23, 11-year store, alone on the node) and only orders the
# work and feeds --dry-run: the runner starts the longest remaining chain first. Change a number here to change how a source is run;
# adding a source needs no code change.

defaults:
  python: /global/common/software/m1867/python/hackathon/bin/python
  # Threads of numerical libraries inside each worker: one, as in the test runs, so that ~200 workers do not oversubscribe the node
  env:
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
  # AR/TC/ETC masks of IMERG (from ERA5, already on the HEALPix grid). The CFS copy is the durable one (identical to the pscratch copy)
  era5_zarr: /global/cfs/cdirs/wcm_shr/hk25/all_masks/ERA5_AR_TC_ETC_hp8_v1.zarr
  # Thresholds: percentiles, the wet-window threshold that production used (also the script's own default, passed explicitly so
  # that it is recorded in the step's command), and the cells
  # per block of the quantile (2-4 GB resident per task in the full run, so that several sources can compute thresholds together)
  percentiles: [90, 95]
  min_precip_threshold: 0.1
  threshold_cell_chunk_size: 131072
  # Steps are killed after this many minutes (a hung Dask cluster); generous, the longest step takes about 55 min (IMERG Step 1)
  timeout_min: {s1: 240, s2: 60, s3: 150, monthly: 90, thresholds: 90, attribution: 120}

steps:
  s1:          {slots: 24, est_min: 30}
  s2:          {slots: 16, est_min: 1}
  s3:          {slots: 24, est_min: 10}
  monthly:     {slots: 48, est_min: 2}      # 12 workers x 4 threads
  thresholds:  {slots: 8,  est_min: 2, env: {DASK_NUM_WORKERS: "8"}}
  attribution: {slots: 24, est_min: 9}

sources:
  IMERGv7:
    aliases: [IR_IMERG, imerg]
    config_key: IR_IMERG                   # key in config_sources.yaml
    source_name: IMERGv7                   # names the product files
    mcs_config: config_mcs_tbpf_IMERGv7.yml
    step2: era5_imerg                      # AR/TC/ETC from ERA5, not from tracking files
    # Thresholds from a non-IR 6-hourly IMERG store, which has data at all latitudes (the IR-based tot_pr is 0 poleward of 60).
    # Since 2026-09-23 the 11-year store (2014-2024, a temporal-only mean of the hourly IMERG made with coarsen_healpix.py) and no
    # longer the 3-year one (IMERG_V7_6H_zoom8_20190101_20211231.zarr, the record of the COF masks): the attribution still analyzes the
    # record of the masks and only takes which cells are extreme from these thresholds. The two stores are two constructions of IMERG V07
    # (see docs/AUDIT_FINDINGS.md item 18). The version puts _v1_2014_2024 in the name of the thresholds file, which the attribution
    # reads (--threshold_file), so the plain 3-year IMERGv7_precip_percentiles_6h_hp8_v1.nc that the threshold-map notebooks read is
    # neither overwritten nor made by the runner (to make it, see docs/procedures/run_cof_pipeline.md).
    thresholds:
      input_zarr: /pscratch/sd/w/wcmca1/GPM/healpix/IMERG_V7_6H_zoom8_20140101_20241231.zarr
      input_var: precipitation
      version: v1_2014_2024
    # Other input stores to check before the run (the IR store that Step 1 reads Tb and precipitation from)
    check_stores: [/pscratch/sd/w/wcmca1/GPM/healpix/IR_IMERG_V7_1H_zoom8_20190101_20211231.zarr]
    steps:
      s1:          {slots: 48, est_min: 55}
      s2:          {slots: 32, est_min: 1}
      s3:          {slots: 32, est_min: 21}
      monthly:     {est_min: 3}
      thresholds:  {est_min: 21}           # the 11-year store (3 min with the 3-year one)
      attribution: {est_min: 18}

  scream:
    aliases: [scream_ne120]
    config_key: scream_ne120
    source_name: scream
    mcs_config: config_mcs_tbpf_scream.yml
    step2: tracks
    thresholds: {from_step1: true}         # tot_pr of Step 1
    steps:
      s1:          {slots: 32, est_min: 35}

  icon_d3hp003:
    aliases: [icon]
    config_key: icon_d3hp003
    source_name: icon_d3hp003
    mcs_config: config_mcs_tbpf_icon_d3hp003.yml
    step2: tracks
    thresholds: {from_step1: true}
    steps:
      s1:          {est_min: 34}

  nicam_gl11:
    aliases: [nicam]
    config_key: nicam_gl11
    source_name: nicam_gl11
    mcs_config: config_mcs_tbpf_nicam_gl11.yml
    step2: tracks
    thresholds: {from_step1: true}
    steps:
      s1:          {est_min: 32}

  um_glm_n2560_RAL3p3:
    aliases: [um]
    config_key: um_glm_n2560_RAL3p3
    source_name: um_glm_n2560_RAL3p3
    mcs_config: config_mcs_tbpf_um_glm_n2560_RAL3p3.yml
    step2: tracks
    thresholds: {from_step1: true}
    steps:
      s1:          {est_min: 34}

  casesm2_10km_nocumulus:
    aliases: [casesm2]
    config_key: casesm2_10km_nocumulus
    source_name: casesm2_10km_nocumulus
    mcs_config: config_mcs_tbpf_casesm2_10km_nocumulus.yml
    step2: tracks
    thresholds: {from_step1: true}
    steps:
      s1:          {est_min: 29}
