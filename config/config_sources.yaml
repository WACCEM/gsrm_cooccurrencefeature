---
# Configuration file for different data sources
catalog_file: "https://digital-earths-global-hackathon.github.io/catalog/catalog.yaml"

# IMERG configuration
IR_IMERG:
  source_name: IMERGv7
  catalog_location: NERSC
  catalog_params:
    zoom: 8
    time: PT6H
    time_method: mean
  varname_precip_liq: precipitation
  pr_convert_factor: 1.0  # Convert from [mm/s] to [mm/h]
  start_datetime: 2019-01-01T00:00
  end_datetime: 2021-12-31T23:59
  # start_datetime: 2019-08-01T00:00
  # end_datetime: 2020-08-31T23:59
  # Percentile thresholds that calc_stormtype_extreme_precip_spatial.py reads when --threshold_file is not given:
  # extreme_precip/{source_name}_precip_percentiles_6h_hp8_{threshold_version}.nc under the data root (v1, the thresholds script's
  # default, when this key is absent). Since 2026-09-23 the 2014-2024 thresholds for IMERG (the pipeline registry,
  # config_pipeline.yaml, makes that file; tests/test_run_cof_pipeline_thresholds.py checks that the two agree). The plain 3-year
  # IMERGv7_precip_percentiles_6h_hp8_v1.nc is kept for the threshold-map notebooks.
  threshold_version: v1_2014_2024

# GSMaP configuration (second observational product; not in the catalog, uses a local 6-hourly Zarr store; not part of the
# COF pipeline registry -- no MCS/AR/ETC tracking, so it is run standalone through calc_extreme_precip_thresholds.py for the
# extreme-precipitation-threshold comparison only)
GSMAP:
  source_name: GSMaPv8
  catalog_location: NERSC
  catalog_params:
    zoom: 8
  varname_precip_liq: hourlyPrecipRate
  varname_precip_ice:
  pr_convert_factor: 1.0  # Already in [mm/h]
  # Metadata only (start_date/end_date global attrs, unless overridden by the actual data when --start_time/--end_time is
  # given) -- the store's full extent; the 2019-2021 window matching IMERG's 6-hourly store is applied at invocation with
  # --start_time/--end_time, not by these dates.
  start_datetime: 2010-01-01T00:00
  end_datetime: 2024-12-31T23:59

# SCREAM model configuration
scream_ne120:
  source_name: scream
  catalog_location: NERSC
  catalog_params:
    zoom: 8
  varname_precip_liq: pr
  varname_precip_ice: prs
  pr_convert_factor: 3600000.0  # Convert from [m/s] to [mm/h]
  start_datetime: 2019-08-01T00:00
  end_datetime: 2020-08-31T23:59
  # dir_te: /pscratch/sd/b/beharrop/kmscale_hackathon/hackathon_pre/screamv2_ne120_tracking/
  dir_te: /pscratch/sd/b/beharrop/kmscale_hackathon/hackathon_pre/screamv2_ne120_tracking_etc_nocoldcoreonly/
  source_te: screamv2_ne120
  source_res: hp8_hp8

