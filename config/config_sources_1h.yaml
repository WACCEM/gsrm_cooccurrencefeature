---
# Configuration file for different data sources (1-hourly)
# Note: not all catalog models support the 'time' or 'time_method' catalog_params.
#       For models that do not support these parameters, they are omitted.
catalog_file: "https://digital-earths-global-hackathon.github.io/catalog/catalog.yaml"
# catalog_file: /global/homes/f/feng045/program/hackathon/catalog/NERSC/main.yaml

# IMERG configuration (IMERG data is not in the catalog; using local 1-hourly Zarr files)
IMERG:
  source_name: IMERGv7
  catalog_location: NERSC
  catalog_params:
    zoom: 8
  varname_precip_liq: precipitation
  varname_precip_ice:
  pr_convert_factor: 1.0  # Already in [mm/h]
  # Metadata only (start_date/end_date global attrs in the output NetCDF) -- must match
  # the Zarr path actually opened in load_precipitation_data(), not used to subset data.
  start_datetime: 2001-01-01T00:00
  end_datetime: 2024-12-31T23:59

# GsMAP configuration
GSMAP:
  source_name: GsMAPv8
  catalog_location: NERSC
  catalog_params:
    zoom: 8
  varname_precip_liq: hourlyPrecipRate
  varname_precip_ice:
  pr_convert_factor: 1.0  # Already in [mm/h]
  start_datetime: 2010-01-01T00:00
  end_datetime: 2024-12-31T23:59

# SCREAM model configuration
# Note: scream_ne120 does not support 'time' or 'time_method' in catalog_params
# IMPORTANT: the catalog's own "scream_ne120" entry is 3-HOURLY AVERAGED data
# (confirmed: its 'pr' carries an 'averaging_count_tracker' attribute, and its
# measured time spacing is exactly 3h) -- correct for the 6-hourly
# config_sources.yaml (3h aggregates cleanly into 6h bins), but not genuinely
# hourly, so unsuitable for this _1h script. catalog_source_name below redirects
# the actual data load to the catalog's "scream2D_hrly" entry instead -- genuinely
# 1-hourly INSTANTANEOUS (confirmed: exact 1h spacing, no averaging attribute),
# same units, no separate ice-precip term (pr is already total), and supports zoom
# 0-10 (vs. scream_ne120's 0-8). The config key/source_name/CLI usage/output
# filename here are unchanged -- see load_precipitation_data()'s docstring for how
# catalog_source_name works.
scream_ne120:
  source_name: scream
  catalog_location: NERSC
  catalog_source_name: scream2D_hrly
  catalog_params:
    zoom: 8
  varname_precip_liq: pr
  varname_precip_ice:
  pr_convert_factor: 3600000.0  # Convert from [m/s] to [mm/h]
  start_datetime: 2019-08-01T00:00
  end_datetime: 2020-09-01T00:00
  dir_te: /pscratch/sd/b/beharrop/kmscale_hackathon/hackathon_pre/screamv2_ne120_tracking/
  source_te: screamv2_ne120
  source_res: hp8_hp8

# ICON model configuration
icon_d3hp003:
  source_name: icon_d3hp003
  catalog_location: NERSC
  catalog_params:
    zoom: 8
    time: PT1H
    time_method: inst
  varname_precip_liq: pr
  varname_precip_ice: prs
  pr_convert_factor: 3600.0  # Convert flux unit to [mm/h]
  start_datetime: 2020-01-02T00:00
  end_datetime: 2020-12-31T23:59
  dir_te: /pscratch/sd/b/beharrop/kmscale_hackathon/hackathon_pre/icon_d3hp003_1year_tracking/
  source_te: icon_d3hp003
  source_res: hp8_PT1H

# NICAM model
nicam_gl11:
  source_name: nicam_gl11
  catalog_location: NERSC
  catalog_params:
    zoom: 8
    time: PT1H
  varname_precip_liq: pr
  varname_precip_ice:
  pr_convert_factor: 3600.0  # Convert flux unit to [mm/h]
  start_datetime: '2020-03-01T00:00'
  end_datetime: '2021-02-28T23:59'
  dir_te: /pscratch/sd/b/beharrop/kmscale_hackathon/hackathon_pre/nicam_gl11_tracking/
  source_te: nicam_gl11
  source_res: hp8_PT1H

# UM model
# Note: um_glm_n2560_RAL3p3 does not support 'time' or 'time_method' in catalog_params
um_glm_n2560_RAL3p3:
  source_name: um_glm_n2560_RAL3p3
  catalog_location: NERSC
  catalog_params:
    zoom: 8
  varname_precip_liq: pr
  varname_precip_ice:
  pr_convert_factor: 3600.0  # Convert flux unit to [mm/h]
  start_datetime: 2020-01-01T00:00
  end_datetime: 2021-02-28T23:59
  dir_te: /pscratch/sd/b/beharrop/kmscale_hackathon/hackathon_pre/um_glm_n2560_RAL3p3_tracking/
  source_te: um_glm_n2560_RAL3p3
  source_res: hp8_PT1H

# CASESM2 model configuration
# WARNING: the catalog's own casesm2_10km_nocumulus 'pr' is ALL-NaN at zoom 9
# (confirmed directly: 0% finite in a sampled slice; zoom 8 is fine, 100% finite).
# A plain catalog run at zoom 9 "succeeds" but silently writes P95/P99=nan (as
# happened for the v1 hp9 output before this was caught). A correct local store
# exists instead -- run zoom 9 with an explicit --input_zarr override:
#   /global/cfs/cdirs/wcm_shr/hk25/healpix/casesm2_10km_nocumulus/casesm2_10km_nocumulus_hourly_pr_and_rlut_hp9.zarr
# (1 year, native chunks (24, 262144) -- same good shape as IMERG/GSMAP; has pr but
# not prs, same as the catalog entry, so varname_precip_ice below is already a
# no-op for this source at either zoom). This is a manual, per-run override, not an
# automatic redirect (unlike scream_ne120's catalog_source_name above) -- a bulk
# "submit all sources" run at zoom 9 will still rebuild the all-NaN file unless run
# individually with --input_zarr; see the slurm script's header for the command.
casesm2_10km_nocumulus:
  source_name: casesm2_10km_nocumulus
  catalog_location: NERSC
  catalog_params:
    zoom: 8
    time: PT1H
  varname_precip_liq: pr
  varname_precip_ice: prs
  pr_convert_factor: 3600.0  # Convert flux unit to [mm/h]
  start_datetime: 2020-03-01T00:00
  end_datetime: 2021-02-28T23:59
  dir_te: /pscratch/sd/b/beharrop/kmscale_hackathon/hackathon_pre/casesm2_10km_nocumulus_tracking/
  source_te: casesm2_10km_nocumulus
  source_res: hp8_PT1H

# IFS model configuration
ifs_tco3999_rcbmf:
  source_name: ifs_tco3999_rcbmf
  catalog_location: online
  catalog_params:
    zoom: 8
    time: PT1H
    time_method: mean
  varname_precip_liq: pr
  varname_precip_ice:
  pr_convert_factor: 3600.0  # Convert flux unit to [mm/h]
  start_datetime: 2020-01-01T00:00
  end_datetime: 2021-03-31T23:59
  dir_te: /pscratch/sd/b/beharrop/kmscale_hackathon/hackathon_pre/ifs_tco3999_rcbmf_tracking/
  source_te: ifs_tco3999_rcbmf
  source_res: PT1H
